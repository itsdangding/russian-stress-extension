<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>俄语重音助手</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>俄语重音助手</h1>
      <button id="toggle-hover" type="button">开启悬停查词</button>
      <button id="accent-page" type="button">给当前页面加重音</button>
      <button id="accent-selection" type="button">给选中文本加重音</button>
      <button id="accent-current" type="button">给光标所在输入框加重音</button>
      <a id="open-options" href="#">自定义词典</a>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
